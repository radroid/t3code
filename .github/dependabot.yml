# coil fork Dependabot config. Upstream has no `.github/dependabot.yml`, so this file is
# fork-owned and costs no seam-ledger row. It configures NO version updates; its job is to
# shape *security* updates, which always run against the default branch.
#
# One npm block, rooted at `/`. An earlier revision added a second block whose `directories`
# globbed `/.repos/**` with a wildcard `ignore`; the security-update jobs GitHub actually ran
# carried `"ignore-conditions": []` for both blocks, so that shape never reached them. Dependabot
# requires npm entries not to overlap, and `exclude-paths` is the documented lever for vendored
# code.
#
# `.repos/effect-smol` and `.repos/alchemy-effect` are `git subtree`s of other projects,
# maintained by `scripts/sync-reference-repos.ts`. They are reference source for agents to read,
# not code this fork runs: no glob in `pnpm-workspace.yaml` matches them, CI sparse-checks-out
# `!/.repos/`, and a fork-local edit inside a subtree conflicts on the next `subtree pull`.
# Dependabot also cannot update them (alchemy-effect's manifest references a git submodule that
# is not present in the subtree copy), so every job for them is a red run by construction.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    exclude-paths:
      - ".repos/**"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    # Transitive dependencies Dependabot cannot move: every one of these ends in
    # `security_update_not_possible` because a parent's range caps the resolvable version below
    # the patched one. The fix is a manual re-resolution in `pnpm-workspace.yaml` overrides, not
    # something Dependabot can automate. Suppressing the job does NOT suppress the alert, which
    # stays visible in the Security tab. Named rather than wildcarded on purpose: a wildcard
    # would silence the fixable ones too. Remove an entry when its constraint is re-resolved.
    ignore:
      # query-string@7 (via @react-navigation/core) pins decode-uri-component to ^0.2; the
      # patched 0.5.0 needs query-string 8, which is ESM-only and would patch react-navigation.
      - dependency-name: "decode-uri-component"
