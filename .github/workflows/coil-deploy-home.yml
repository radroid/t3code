# Deploys the fork's homepage (apps/coil-home) to the `coil-home` Cloudflare Worker.
#
# Requires the repo secret CLOUDFLARE_API_TOKEN (Account → Workers Scripts → Edit) and the repo
# variable CLOUDFLARE_ACCOUNT_ID; both are set. If either is ever removed this job fails at the
# deploy step, and `pnpm run deploy` from apps/coil-home is the manual fallback.
#
# The daily sync force-pushes `main`, and on an undiffable force push GitHub runs `paths`-filtered
# workflows anyway. That is harmless: `wrangler deploy` is idempotent.
name: "coil: deploy homepage"

on:
  push:
    branches:
      - main
    paths:
      - "apps/coil-home/**"
      - ".github/workflows/coil-deploy-home.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coil-home-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy coil-home
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/coil-home...

      - name: Build
        run: vp run --filter @t3tools/coil-home build

      # `setup-vp` puts `vp` on PATH but not `pnpm` — it keeps pnpm inside its own managed
      # directory — so the `pnpm dlx` below exits 127 without this. Same step as the three
      # mobile-* workflows; keep them identical.
      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      # wrangler is fetched on demand rather than depended on — it drags ~500 lines into
      # pnpm-lock.yaml, which SEAMS.md records as the fork's second-worst rebase-conflict surface.
      #
      # The version is pinned EXACTLY, not to `@4`. This step is the only place in the repo that
      # runs an on-demand package while holding CLOUDFLARE_API_TOKEN, and a floating major would
      # let any future 4.x release — or a compromised transitive dep of one — execute with that
      # token, with no lockfile or integrity check standing in the way. Pinning keeps the
      # zero-lockfile-rows property that motivated `pnpm dlx` in the first place and makes each
      # wrangler upgrade an explicit, reviewable commit. Keep in step with
      # apps/coil-home/package.json's `deploy` script.
      - name: Deploy to Cloudflare
        working-directory: apps/coil-home
        run: pnpm dlx wrangler@4.120.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 403 is a PASS here, and that is not a workaround for a broken site.
      #
      # The curlycloud.dev zone runs Cloudflare bot mitigation, which blocks datacenter ASNs —
      # and GitHub's hosted runners are exactly that. Measured 2026-08-11: the same URL at the
      # same moment returned 200 from a residential IP and a real browser, and 403 from two
      # separate datacenter egresses, on every path. So a 403 here says "the runner is a bot",
      # not "the deploy broke", and failing on it makes this job permanently red.
      #
      # To restore a genuine end-to-end gate, add a WAF skip rule for a secret header (or turn
      # bot mitigation off) in the Cloudflare dashboard, then tighten this back to 200-only.
      # Until then the real deploy signal is the wrangler step above, which fails on any error.
      #
      # 5xx and 404 still fail: those come from the origin, not the bot filter. They are retried
      # first because a freshly-provisioned custom domain propagates per-path over a few minutes.
      - name: Verify live site
        run: |
          url=https://coil.curlycloud.dev/
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            case "$code" in
              200)
                echo "$url returned 200"
                exit 0
                ;;
              403)
                echo "::notice::$url returned 403 — Cloudflare bot mitigation blocks GitHub runners. Treating as reachable; see the comment above this step."
                exit 0
                ;;
              *)
                echo "attempt $attempt: $url returned $code"
                sleep 20
                ;;
            esac
          done
          echo "::error::$url still returning $code after 5 attempts"
          curl -sSI "$url" || true
          exit 1
