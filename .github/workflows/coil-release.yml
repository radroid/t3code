# coil fork release — build the desktop app on every green merge to main and publish it.
#
# Upstream's release.yml cannot be reused: it runs on blacksmith-12vcpu-macos-26 and
# blacksmith-32vcpu-windows-2025, runners this fork has no access to (the same reason coil-ci.yml
# exists alongside ci.yml). Every inherited upstream workflow, release.yml included, is
# disabled_manually on this fork.
#
# Standard GitHub-hosted runners — macOS and Windows included — are free with unlimited minutes on
# public repositories, and this fork is public. The build costs nothing.
#
# Design: docs/superpowers/specs/2026-08-03-update-delivery-design.md
name: coil fork release

# workflow_run, NOT push.
#
# coil-ci is a separate workflow and `needs:` cannot cross workflows, so this is the only way to
# gate on it. The cost is a footgun that matters enormously here: under workflow_run, github.sha
# is the DEFAULT BRANCH TIP, not the commit that was tested. Every checkout below pins
# workflow_run.head_sha, and the build asserts it got that commit — for a design whose entire
# identity is the commit, building the wrong one is silent and fatal.
on:
  workflow_run:
    workflows: ["coil fork CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to build (defaults to main's tip)"
        required: false
        type: string

permissions:
  contents: write

# Not cancel-in-progress. A half-cancelled release can leave a tag created and assets missing,
# and two merges landing minutes apart is normal here.
concurrency:
  group: coil-release
  cancel-in-progress: false

env:
  BUILD_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}

jobs:
  resolve:
    name: Resolve build identity
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      short_sha: ${{ steps.identity.outputs.short_sha }}
      version: ${{ steps.identity.outputs.version }}
      build_number: ${{ steps.identity.outputs.build_number }}
      tag: ${{ steps.identity.outputs.tag }}
      changes: ${{ steps.identity.outputs.changes }}
      is_tip: ${{ steps.identity.outputs.is_tip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SHA }}
          # Full history and tags: the changelog is `git log <previous release tag>..<sha>`, and a
          # shallow clone has neither endpoint. Only this job pays for it; build and publish stay
          # shallow.
          fetch-depth: 0
          fetch-tags: true
          # .repos/ is tracked: 12,961 files, 126 MB. Upstream excludes it from every job.
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: identity
        name: Resolve identity
        shell: bash
        # BUILD_SHA is read from the environment rather than interpolated into the script. On the
        # workflow_dispatch path it is user-supplied, and `${{ }}` interpolation splices the raw
        # value into the shell source before bash ever sees it.
        env:
          # +100 is LOAD-BEARING. Do not "simplify" it away.
          #
          # `github.run_number` is scoped to a workflow, and GitHub identifies a workflow by its
          # FILE PATH. Renaming this file (it used to be the t3x-prefixed one) for #71 therefore
          # did not continue the old sequence — it began a new one at 1.
          #
          # This number is the manifest's `buildNumber`, and `decision.ts` is a pure
          # `manifest.buildNumber <= installed.buildNumber` comparison. Published builds were at
          # 26 when this file was renamed, so an un-offset counter would have shipped build 1 to
          # every installed client, each of which would have evaluated `1 <= 26` and skipped —
          # forever, and silently, because "skip" is the ordinary outcome of that branch and looks
          # exactly like being up to date.
          #
          # 100 clears both the old high-water marks: 32 (the last run under the previous filename)
          # and 26 (the last published build). The first coil build is 101. Renaming this file
          # again would need a fresh offset above whatever is published by then.
          #
          # The addition happens in bash below, NOT here. GitHub's expression syntax has no
          # arithmetic operators at all — its operator list stops at comparison and logic — so
          # `${{ github.run_number + 100 }}` is not a wrong answer, it is a parse failure that
          # takes the whole file down: the run is created, no jobs exist, and the only diagnostic
          # is "this run likely failed because of a workflow file issue".
          BUILD_COUNTER_OFFSET: 100
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::BUILD_SHA is not a 40-character commit sha." >&2
            exit 1
          fi

          # See BUILD_COUNTER_OFFSET above for why this addition exists and why it is here rather
          # than in the expression. Asserted, not assumed: a counter that silently came out as 0 or
          # empty would publish a build every installed client treats as older than what it has.
          BUILD_COUNTER=$((RUN_NUMBER + BUILD_COUNTER_OFFSET))
          if [[ ! "$BUILD_COUNTER" =~ ^[0-9]+$ ]] || (( BUILD_COUNTER <= 26 )); then
            echo "::error::BUILD_COUNTER resolved to '$BUILD_COUNTER', which is not above the last" \
                 "pre-rename published build (26). Clients would skip this release forever." >&2
            exit 1
          fi

          sha="$(git rev-parse HEAD)"
          if [[ "$sha" != "$BUILD_SHA" ]]; then
            echo "::error::Checked out $sha but expected $BUILD_SHA." >&2
            exit 1
          fi

          # 12 characters, matching `git rev-parse --short=12` in build-desktop-artifact.ts and
          # COMMIT_HASH_DISPLAY_LENGTH in DesktopAppIdentity.ts. This is the value the app can
          # actually read about itself, so it is the only honest comparison key.
          short_sha="$(git rev-parse --short=12 HEAD)"

          # The fork's build counter, and the reason the version is orderable at all.
          #
          # The upstream base does not move between syncs (0.0.31 -> 0.0.31, issue #47), so without
          # a fork-owned counter every build here would carry an identical version. An earlier
          # draft used the short sha instead: identifiable, but semver compares prerelease
          # identifiers, and `-coil.a3f9c21b` vs `-coil.b0e77c14` sorts alphabetically by hash, which
          # orders nothing. A numeric identifier sorts numerically, so 0.0.31-coil.43 correctly
          # precedes 0.0.31-coil.44.
          #
          # This is the SAME number the manifest carries as buildNumber and the relay orders on.
          # One counter, used everywhere, rather than a version scheme that disagrees with the
          # update logic.
          #
          # The sha is not lost: it is in the release tag, both asset filenames, the manifest, and
          # t3codeCommitHash inside the app. Version answers "which is newer"; the hash answers
          # "which commit". Keeping those separate is the whole lesson of #47.
          #
          # --build-version becomes electron-builder's `version` and must be valid semver — a raw
          # sha is not. resolveDesktopUpdateChannel only special-cases -nightly.<d>.<d>, so a -coil.
          # prerelease stays on the "latest" channel and the product name is unchanged.
          base="$(node -p "require('./apps/desktop/package.json').version")"
          echo "sha=$sha"                          >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha"              >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_COUNTER}"        >> "$GITHUB_OUTPUT"
          echo "version=${base}-coil.${BUILD_COUNTER}" >> "$GITHUB_OUTPUT"
          echo "tag=coil-build-${short_sha}"       >> "$GITHUB_OUTPUT"

          # Whether this build may claim GitHub's "Latest" pointer.
          #
          # Every release is a full release rather than a prerelease — GitHub refuses to mark a
          # prerelease as latest, and this fork has exactly one channel, so publishing the build the
          # download page hands to first-time users as a "prerelease" was the inconsistency. But
          # "latest" must mean the NEWEST build, and two distinct paths reach this line with an
          # older commit:
          #
          # 1. The republish recipe. When publishing fails, the step below prints
          #    `gh workflow run coil-release.yml -f sha=<sha>` — and that dispatch accepts any sha.
          #    Rebuilding an old commit must not demote the build users are currently offered.
          # 2. Out-of-order publishes. `concurrency` here is cancel-in-progress: false and GitHub
          #    keeps only one pending run per group, so two merges landing close together are not
          #    guaranteed to publish in the order they landed.
          #
          # Gating on the tip is self-correcting under both: whichever run IS the tip takes the
          # pointer, and a late-running older build declines it instead of clobbering it. The
          # publish step passes this straight to `make_latest`, and `make_latest: false` leaves the
          # existing pointer alone rather than clearing it — so there is never a window in which the
          # repository has no latest release.
          #
          # `git ls-remote`, not `git rev-parse origin/main`: this job checks out a detached
          # BUILD_SHA, so there is no origin/main remote-tracking ref here to read.
          main_tip="$(git ls-remote origin refs/heads/main | cut -f1 || true)"
          if [[ ! "$main_tip" =~ ^[0-9a-f]{40}$ ]]; then
            # Never fail a release over this. A build that cannot prove it is the tip just does not
            # claim the pointer, which leaves the previous latest in place.
            echo "::warning::Could not resolve main's tip (got '$main_tip'); not marking this release latest."
            is_tip=false
          elif [[ "$main_tip" == "$sha" ]]; then
            is_tip=true
          else
            echo "main is at $main_tip but this build is $sha; not marking it latest."
            is_tip=false
          fi
          echo "is_tip=$is_tip" >> "$GITHUB_OUTPUT"

          # What changed since the last release we actually published.
          #
          # Anchored on the previous RELEASE TAG, not on main's ancestry. The sync playbook
          # force-pushes main, so "the commits since the last build" cannot be derived from
          # branch history — a released commit may not even be an ancestor of main. Tags survive
          # that rewrite, and `git log A..B` is "reachable from B, not from A", which stays
          # correct when A is not an ancestor of B.
          #
          # Newest first. Merge commits are dropped: on a squash-merge fork their subjects are
          # duplicates of the commit they merged.
          # Both prefixes, permanently. #71 renamed the tag from `t3x-build-*` to `coil-build-*`,
          # and a lookup that knew only the new one would have found nothing on the first coil
          # release, taken the "first release ever" branch below, and shipped an empty changelog
          # for a build that had 20-odd commits in it. The old tags do not expire, so neither does
          # this: dropping `t3x-build-*` later would silently re-break the same release note the
          # day someone rebuilds an old sha.
          previous="$(git tag --list 'coil-build-*' 't3x-build-*' --sort=-creatordate | head -n 1 || true)"
          if [[ -z "$previous" ]]; then
            # First release ever: there is no range. Emitting the entire history as a "changelog"
            # would render a toast with thousands of entries.
            echo "No previous coil-build-* or t3x-build-* tag; emitting an empty changelog."
            changes=""
          else
            echo "Changelog range: ${previous}..${sha}"
            # Capped. An unbounded range after a long CI outage (four straight failures has
            # happened here) would produce a toast nobody can read, and a manifest nobody wants to
            # ship. The count in the title still comes from this list, so the cap is visible as
            # "20 changes" rather than silently truncating a larger number.
            changes="$(git log "${previous}..${sha}" --no-merges --format=%s --max-count=20 || true)"
          fi

          # Commit subjects are attacker-influenced content — anyone whose commit reaches main,
          # including an upstream sync, chooses this text. Two hardening steps, both load-bearing:
          #
          # 1. A random delimiter. With a fixed one, a commit subject equal to that literal would
          #    close the heredoc early and let the rest of the subject write arbitrary job outputs
          #    (`tag=`, `sha=`) — which this workflow then uses to tag and publish a release.
          # 2. Control characters stripped, so nothing can smuggle a newline or an escape sequence
          #    into a value that later lands in an env var and a toast.
          delim="COIL_CHANGES_$(openssl rand -hex 16)"
          changes="$(printf '%s' "$changes" | tr -d '\000-\010\013\014\016-\037')"
          {
            echo "changes<<${delim}"
            echo "$changes"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: [resolve]
    runs-on: ${{ matrix.runner }}
    # Upstream's 30 minutes is calibrated for 12-32 vCPU blacksmith runners. A cold macos-latest
    # (3 vCPU, 7 GB) with no pnpm store, no cargo target dir and an Electron download is
    # realistically 20-40 min; Windows NSIS is 30-60 given issue #47's ~18 min on a warm desktop.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-latest
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            asset_glob: "*.dmg"
            asset_ext: dmg
            manifest_platform: darwin-arm64
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            asset_glob: "*.exe"
            asset_ext: exe
            manifest_platform: win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Free disk space
        if: ${{ matrix.platform == 'mac' }}
        shell: bash
        run: |
          # Standard runners ship ~14 GB free. node_modules alone is ~5.9 GB locally, and the mac
          # build produces an unpacked ~1 GB app plus a 237 MB dmg on top of a second prod install
          # tree. Reclaim what we can before starting.
          sudo rm -rf /Users/runner/Library/Android /Users/runner/hostedtoolcache/CodeQL || true
          df -h /

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # cargo is an UNCONDITIONAL dependency of the desktop build: stageResourceMonitor is called
      # with no platform or flag guard and hard-fails when the binary is missing.
      # native/resource-monitor is edition 2024, so Rust >= 1.85 is required. Do not rely on the
      # runner image having a new enough toolchain.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/resource-monitor

      - name: Ensure Electron runtime is installed
        shell: bash
        # `--filter` is required: ensure:electron is a package task (@t3tools/desktop), not a root
        # one, and `vp run ensure:electron` fails the job outright with "Task not found". Matches
        # ci.yml, release.yml and coil-weekly-verify.yml, which all scope it the same way.
        run: vp run --filter @t3tools/desktop ensure:electron

      # Issue #70: WITHOUT this step the mac artifact is ad-hoc signed, its designated requirement
      # is the binary's cdhash, and macOS re-requests every permission (Screen Recording,
      # Accessibility, Microphone, Files & Folders, Local Network) after every single update.
      #
      # The identity is a self-signed certificate created by scripts/coil/setup-mac-signing.sh; the
      # private key reaches CI as a p12 in T3X_MAC_CSC_P12_BASE64. It buys stability, not trust:
      # the app is still not notarized, and does not need to be, because the requirement only has to
      # stop MOVING for the grants to stick.
      #
      # No edit to build-desktop-artifact.ts (an upstream-owned file) is needed for any of this.
      # That file forces CSC_IDENTITY_AUTO_DISCOVERY=false for unsigned builds, but electron-builder
      # checks the flag only when NO identity was named — app-builder-lib's findIdentity() reads
      # `qualifier || process.env.CSC_NAME` first and, when that is non-empty, goes straight to
      # `security find-identity`. So exporting CSC_NAME on the build step is enough, and the fork's
      # zero-seam property survives. Do not "simplify" this by passing --signed instead: that takes
      # the macOS passkey path, which demands T3CODE_CLERK_PUBLISHABLE_KEY and a provisioning
      # profile, and turns on notarization expectations a self-signed certificate cannot satisfy.
      - name: Import the macOS signing identity
        id: signing
        if: ${{ matrix.platform == 'mac' }}
        shell: bash
        env:
          CSC_P12_BASE64: ${{ secrets.T3X_MAC_CSC_P12_BASE64 }}
          CSC_P12_PASSWORD: ${{ secrets.T3X_MAC_CSC_PASSWORD }}
          IDENTITY_NAME: T3 Coil Code Signing
        run: |
          set -euo pipefail

          if [[ -z "${CSC_P12_BASE64:-}" || -z "${CSC_P12_PASSWORD:-}" ]]; then
            echo "::warning::No macOS signing secrets set, so this build is ad-hoc signed and will re-request every macOS permission once installed. See docs/coil/mac-signing-runbook.md."
            {
              echo "signed=false"
              echo "identity="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keychain="$RUNNER_TEMP/t3x-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          p12="$RUNNER_TEMP/t3x-signing.p12"
          printf '%s' "$CSC_P12_BASE64" | base64 --decode > "$p12"

          security create-keychain -p "$keychain_password" "$keychain"
          # No -t: the default 300-second idle lock would expire during a 30-minute build and the
          # signing step would fail with "no identity found" long after this step went green.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$CSC_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # -T above is not sufficient on its own since macOS 10.12: without the partition list,
          # codesign gets a GUI authorisation prompt, which on a runner means a hung job.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" >/dev/null

          # electron-builder calls `security find-identity -v` with NO keychain argument, so the
          # keychain has to be in the search list. Re-passing the existing entries is required:
          # `-s` REPLACES the list. Unquoted on purpose — runner keychain paths contain no spaces.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # A self-signed certificate is not "valid for code signing" until it is trusted, and `-v`
          # means valid. Skip this and find-identity lists nothing, electron-builder logs
          # "skipped macOS application code signing" as a WARNING, and the release goes green with
          # exactly the bundle this whole step exists to prevent.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain docs/coil/mac-signing/certificate.pem

          rm -f "$p12"

          if ! security find-identity -v -p codesigning | grep -Fq "$IDENTITY_NAME"; then
            echo "::error::'$IDENTITY_NAME' is not a valid code-signing identity after import." >&2
            security find-identity -v >&2 || true
            exit 1
          fi
          echo "Signing identity available: $IDENTITY_NAME"
          {
            echo "signed=true"
            echo "identity=$IDENTITY_NAME"
          } >> "$GITHUB_OUTPUT"

      # Installed unconditionally by upstream for Windows, separate from the signing block — the
      # staged `vp install --prod` still runs native lifecycle scripts (node-pty, sharp,
      # msgpackr-extract) and recent MSVC + node-gyp wants the Spectre-mitigated libs.
      - name: Install Spectre-mitigated MSVC libs
        if: ${{ matrix.platform == 'win' }}
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & $installer modify --installPath $vsPath `
            --add "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre" `
            --quiet --norestart | Out-Null

      # Issue #47: the desktop build task intermittently dies with STATUS_DLL_INIT_FAILED
      # (0xC0000142) when three vp tasks spawn concurrently. Running it alone is the mitigation,
      # applied here rather than by editing build-desktop-artifact.ts — `vp run build:desktop` is
      # hardcoded there with no concurrency flag, so changing it would cost a new SEAMS.md row.
      #
      # The flag has to sit BEFORE the task name, and the inner command has to be called
      # directly. `vp run --help` is explicit: "Any arguments after the task name are forwarded
      # to the task process." So a trailing `--concurrency-limit 1` never reached vp at all — it
      # was forwarded down into apps/server's build CLI, which rejected it with "Unrecognized
      # flag" and took the whole bundle build down. Passing it to the root `build:desktop` script
      # would not work either: that script shells out to a second `vp run`, which is a fresh
      # process that resets the limit to its default of 4, so the serialisation would be a no-op.
      - name: Build desktop bundle (serialised)
        shell: bash
        env:
          # Issue #53. The web renderer's source maps were 37.4 MiB of a 189.66 MiB app.asar — the
          # single largest line item in the bundle, and 20% of what every user downloads on every
          # update. Nothing reads them: a `.map` is only parsed with --enable-source-maps, which the
          # desktop backend passes through rather than sets (DesktopBackendConfiguration.ts), and
          # renderer maps are DevTools-only.
          #
          # This is an EXISTING upstream variable (apps/web/vite.config.ts), which is why the biggest
          # single win in the issue costs zero seam rows. First-party maps outside the renderer —
          # bin.mjs.map and main.cjs.map, ~12 MiB — are deliberately still built and still shipped, so
          # an operator who exports NODE_OPTIONS=--enable-source-maps keeps readable stack traces for
          # our own code.
          T3CODE_WEB_SOURCEMAP: "0"
        run: |
          set -uo pipefail

          # Inlining build:desktop's body is what lets the flag go in front of the task name, so
          # fail loudly if upstream ever changes that script rather than silently serialising
          # something else — or nothing.
          expected='vp run --filter @t3tools/desktop --filter t3 build'
          actual="$(node -p 'require("./package.json").scripts["build:desktop"] || ""')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::root build:desktop is now '$actual' (expected '$expected'). Re-inline it in coil-release.yml." >&2
            exit 1
          fi

          log=bundle-attempt.log
          for attempt in 1 2 3; do
            status=0
            # `|| status=$?`, not `if vp …; then exit 0; fi` followed by `status=$?`. After an
            # `if` whose condition failed and whose body never ran, `$?` is the *if statement's*
            # status — zero — so the old form reported every real failure as "exit 0" and the
            # retry classification below could never be reached.
            vp run --concurrency-limit 1 --filter @t3tools/desktop --filter t3 build 2>&1 \
              | tee "$log" || status=$?
            if [[ $status -eq 0 ]]; then
              exit 0
            fi
            # Classified on output, not on the exit code. Bash truncates a child's status to 8
            # bits, so 0xC0000142 can never appear in `$?` to be matched, and vp reports its own
            # status rather than the dead grandchild's anyway.
            #
            # The classifier moved out of an inline grep and into scripts/coil/windows-exit-codes.mjs
            # because the grep was wrong (#47). It matched `0xC0000142|0xC0000005|
            # STATUS_DLL_INIT_FAILED|Access violation`, and the observed failure contains none of
            # them — vp prints the SIGNED DECIMAL Node reports, `FAILED (exit code: -1073741502)`.
            # The retry could never have fired. Matching every spelling is now covered by tests
            # built on the log from the issue, and the classifier also prints what the status
            # actually means, so a recurrence is diagnosed from this log rather than from a bare
            # negative integer.
            #
            # Exit 0 from it means retry; 1 means this is a real failure and stopping now is right.
            if node scripts/coil/windows-exit-codes.mjs --classify "$log"; then
              echo "::warning::Attempt $attempt hit a transient Windows process-startup failure (see the classification above). Retrying."
            else
              echo "::error::build:desktop failed with exit $status, and this is not a transient process-startup failure." >&2
              exit "$status"
            fi
          done
          echo "::error::build:desktop failed three times with transient process-startup errors." >&2
          exit 1

      # Issue #53. Kept in its own step so the exact glob list appears in the release log: the list is
      # the risky part of the packaging change, and reading it back out of a failed build matters more
      # than saving a step. scripts/coil/desktop-file-exclusions.mjs is the single source — it also
      # feeds its own unit tests.
      #
      # A STEP OUTPUT, NOT $GITHUB_ENV, and that is deliberate. Upstream's own test asserts
      # DESKTOP_FILE_EXCLUSIONS deep-equals exactly its one entry, so any job-wide export of this
      # variable makes `vp test` fail in that job with a confusing 68-vs-1 array diff. An output is
      # consumed by exactly the one step that names it below.
      - name: Resolve desktop bundle exclusions
        id: exclusions
        shell: bash
        run: |
          set -euo pipefail
          exclusions="$(node scripts/coil/desktop-file-exclusions.mjs)"
          if [[ -z "$exclusions" ]]; then
            echo "::error::scripts/coil/desktop-file-exclusions.mjs produced an empty list." >&2
            exit 1
          fi
          echo "value=$exclusions" >> "$GITHUB_OUTPUT"
          echo "Excluding from the asar:"
          tr ',' '\n' <<< "$exclusions" | sed 's/^/  /'

      - name: Build desktop artifact
        shell: bash
        env:
          # LOAD-BEARING, NOT HYGIENE.
          #
          # Actions sets GITHUB_REPOSITORY automatically. resolveGitHubPublishConfig reads it,
          # which populates buildConfig.publish, which makes electron-builder write
          # Contents/Resources/app-update.yml into the bundle — and that file is exactly what
          # DesktopUpdates reads to decide hasUpdateFeedConfig. A fork build shipping it would be
          # the FIRST ONE EVER to switch upstream's electron-updater on, version-keyed against a
          # version that never bumps (0.0.31 -> 0.0.31, issue #47).
          #
          # Left empty, resolveGitHubPublishConfig returns undefined, no publish config is written,
          # no app-update.yml is packaged, and the updater disables itself with "no update feed is
          # configured". That is what makes the fork's toast the only update surface, at zero
          # upstream edits. The verify step below asserts it.
          GITHUB_REPOSITORY: ""
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ""
          # Issue #70, and the only line that makes the mac build signed. Empty on Windows and
          # whenever no signing secret is configured, which is the same as absent: the build script
          # scrubs empty variables, and electron-builder's findIdentity() treats an empty CSC_NAME as
          # "not specified" and falls back to the ad-hoc path. The verify step below is what turns
          # that silent fallback into a visible one.
          CSC_NAME: ${{ steps.signing.outputs.identity }}
          # The other half of #70. macOS stores one permission row per (service, bundle id), and this
          # fork's app shared `com.t3tools.t3code` with upstream's nightly — so whichever was launched
          # last owned the grants and the other got re-prompted, however well either was signed.
          # Keep this in step with DESKTOP_BUNDLE_IDENTIFIER in scripts/coil/mac-signature.ts; a test
          # asserts the two agree, and the verify step below fails an artifact carrying the wrong id.
          T3X_DESKTOP_APP_ID: dev.curlycloud.t3coil
          # Issue #53. Takes the packaged asar from 189.66 MiB / 14,765 files to 99.02 MiB / 3,429.
          # Scoped to this step on purpose — see the note on the step that produces it.
          T3X_DESKTOP_FILE_EXCLUSIONS: ${{ steps.exclusions.outputs.value }}
        run: |
          set -euo pipefail
          node scripts/build-desktop-artifact.ts \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.resolve.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Verify no update feed was packaged
        shell: bash
        run: |
          set -euo pipefail
          # The machine-checkable form of "exactly one update surface". This is the claim most
          # likely to regress silently on an upstream sync, so it fails the release rather than
          # shipping an app with two updaters that disagree.
          if find release -name "app-update.yml" -print -quit | grep -q .; then
            echo "::error::app-update.yml was packaged. Upstream's updater would be live in this build." >&2
            find release -name "app-update.yml" >&2
            exit 1
          fi
          echo "No app-update.yml packaged."

      # Issue #53's compensating control, and the reason the exclusion list above is safe to grow.
      #
      # The fork now excludes roughly half the asar. The failure mode of one bad glob is a
      # MODULE_NOT_FOUND thrown by a shipped app, on a path that may not run until a user signs in,
      # days after a green release. So this reads the artifact that is about to be published, resolves
      # every bare import in the packaged first-party bundles against what actually survived, and fails
      # if any of them is not loadable — whether or not a fork glob can be blamed for it. Severity does
      # not depend on attribution: a bundle that imports what it does not contain is broken either way,
      # and an earlier draft that warned on unattributed gaps passed a build that could not start.
      #
      # Runs on BOTH platforms: the Windows bundle unpacks node_modules outside the asar (the checker
      # merges app.asar.unpacked back in) and its graph differs (WSL backend, Linux fff binaries), so a
      # mac-only check would not cover it.
      - name: Verify the packaged bundle still resolves
        shell: bash
        run: |
          set -euo pipefail
          asar="$(find release -name "app.asar" -print -quit)"
          if [[ -z "$asar" ]]; then
            echo "::error::No app.asar found under release/. Nothing was verified." >&2
            exit 1
          fi
          node scripts/coil/verify-desktop-bundle.mjs --asar "$asar"

      # The machine-checkable form of "this update will not re-ask for permissions" (issue #70),
      # made against the .app inside the shipped .dmg rather than a staging copy.
      #
      # It exists because electron-builder does not fail when it cannot find an identity — it warns
      # and produces an ad-hoc bundle. Without this step the regression is invisible until the user
      # is clicking through five system dialogs again, days later, with a green release behind them.
      #
      # A CHANGED-but-valid identity is failed too, not just a missing one: a different certificate
      # is still one full round of prompts, and the recorded requirement is the only thing that can
      # tell the difference.
      - name: Verify the macOS artifact keeps its permission grants
        if: ${{ matrix.platform == 'mac' }}
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          dmg="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "::error::No .dmg in release/ to verify." >&2
            exit 1
          fi

          args=(
            --artifact "$dmg"
            --expect-requirement-file docs/coil/mac-signing/designated-requirement.txt
          )
          if [[ "$SIGNED" == "true" ]]; then
            args+=(--expect-authority "$IDENTITY")
          else
            # Downgrade to a warning ONLY when this job knowingly had no identity to sign with.
            args+=(--allow-unsigned)
          fi

          node scripts/coil/verify-mac-signature.ts "${args[@]}"

      - name: Delete the signing keychain
        if: ${{ always() && matrix.platform == 'mac' && steps.signing.outputs.signed == 'true' }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/t3x-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/t3x-signing.p12"

      - name: Collect and rename
        id: collect
        shell: bash
        env:
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          ARCH: ${{ matrix.arch }}
          ASSET_EXT: ${{ matrix.asset_ext }}
          ASSET_GLOB: ${{ matrix.asset_glob }}
          MANIFEST_PLATFORM: ${{ matrix.manifest_platform }}
        run: |
          set -euo pipefail
          mkdir -p staged

          # artifactName is "T3-Code-${version}-${arch}.${ext}", and this fork's version never
          # bumps — so without renaming, every release's asset is literally the same filename.
          # That is issue #47's stale-artifact hazard wearing a different hat.
          src="$(find release -maxdepth 1 -name "$ASSET_GLOB" -print -quit)"
          if [[ -z "$src" ]]; then
            echo "::error::No $ASSET_GLOB produced in release/." >&2
            exit 1
          fi

          dest="staged/T3Coil-${SHORT_SHA}-${ARCH}.${ASSET_EXT}"
          mv "$src" "$dest"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sha256="$(certutil -hashfile "$dest" SHA256 | sed -n '2p' | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
            bytes="$(stat -c %s "$dest")"
          else
            sha256="$(shasum -a 256 "$dest" | cut -d' ' -f1)"
            bytes="$(stat -f %z "$dest")"
          fi

          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              platform: process.argv[2],
              file: path.basename(process.argv[3]),
              sha256: process.argv[4],
              bytes: Number(process.argv[5]),
            }));
          ' "staged/asset-${MANIFEST_PLATFORM}.json" \
            "$MANIFEST_PLATFORM" "$dest" "$sha256" "$bytes"

          ls -la staged

      - name: Upload staged artifact
        uses: actions/upload-artifact@v4
        with:
          name: coil-release-${{ matrix.manifest_platform }}
          path: staged/*
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish and notify
    needs: [resolve, build]
    runs-on: ubuntu-latest
    # 25, not 15: the release fallback below can now spend 7.5 minutes retrying a transient 403,
    # and that has to fit alongside the artifact download with headroom to spare.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: |
            /scripts
            /package.json
          sparse-checkout-cone-mode: false

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coil-release-*
          merge-multiple: true
          path: staged

      - name: Assemble manifest
        id: manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          FULL_SHA: ${{ needs.resolve.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          # The RESOLVED counter, not github.run_number. Since #71 the two differ by the +100
          # offset the resolve job applies, and build-update-manifest.mjs asserts that VERSION ends
          # with `-coil.<RUN_NUMBER>`. Passing the raw run_number here would fail that assertion on
          # every single release — loudly, which is the only reason this was caught rather than
          # shipped. One counter, resolved once, read everywhere.
          RUN_NUMBER: ${{ needs.resolve.outputs.build_number }}
          # run_id addresses the run URL; the build counter is a different number entirely —
          # passing the counter here yields a link to whichever run happens to own that id.
          RUN_ID: ${{ github.run_id }}
          # Read as an env var, never interpolated into shell source: these are commit subjects,
          # so the content is chosen by whoever wrote the commit.
          CHANGES: ${{ needs.resolve.outputs.changes }}
        run: node scripts/coil/build-update-manifest.mjs staged staged/coil-latest.json

      # The install steps used to live inline in this file, which made the release body the only
      # place they existed — and the download page pointed at "the release notes" without linking
      # them, so a first-time reader could go from the landing page to an app macOS calls damaged
      # having never seen one (issue #72). Both surfaces now render
      # scripts/coil/install-instructions.json.
      #
      # A rendering failure must not cost a release: by the time this step runs, both matrix legs
      # have finished and ~22 minutes of macOS and Windows compute is already spent. So a failure
      # here degrades to a minimal body that still points at the download page, and warns.
      - name: Render the release notes
        id: notes
        shell: bash
        env:
          FULL_SHA: ${{ needs.resolve.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          set -uo pipefail
          if ! node scripts/coil/render-release-notes.mjs \
            --sha "$FULL_SHA" --short-sha "$SHORT_SHA" > "$NOTES_PATH"; then
            echo "::warning::Could not render the install notes; publishing a minimal body. This is a bug in scripts/coil/render-release-notes.mjs — the release itself is fine."
            printf 'Automated fork build of `%s`.\n\nInstall instructions: https://coil.curlycloud.dev/download\n' \
              "$FULL_SHA" > "$NOTES_PATH"
          fi
          echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        # The retry below is the error handling for this step, so a failure here must not end the
        # job before it runs.
        continue-on-error: true
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          name: ${{ needs.resolve.outputs.version }}
          # Deliberately NOT a prerelease. GitHub will not mark a prerelease as latest, so while
          # these were prereleases the repository had no latest release at all: /releases/latest
          # 404'd on the API, fell back to the releases list on the web, and left the sidebar
          # without a Latest badge. See the is_tip comment in `resolve` for why make_latest is
          # gated on being main's tip rather than always true.
          prerelease: false
          make_latest: ${{ needs.resolve.outputs.is_tip }}
          files: |
            staged/T3Coil-*
            staged/coil-latest.json
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.path }}

      # Build 9 (run 31244161522) died here: both matrix legs green, both artifacts uploaded, and
      # then ~22 minutes of macOS and Windows compute discarded by one 14-second API call that
      # returned 403 "Resource not accessible by integration".
      #
      # Nothing in the repository explains that 403, and it was checked rather than assumed: the
      # failing job and the job that succeeded 15 minutes later logged IDENTICAL token permissions
      # (`Contents: write`, `Metadata: read`), the workflow has carried `permissions: contents:
      # write` in every revision, the repo default is `write`, and there are no rulesets and no tag
      # protection. So it was transient.
      #
      # The action turns a transient fault into a permanent one on purpose — it logs "Skip retry —
      # your GitHub token/PAT does not have the required permission to create a release" and gives
      # up, because it reads every 403 as a misconfiguration. That is a reasonable default and the
      # wrong one here, where the cost of being wrong is a whole build.
      #
      # Build 24 (run 31453501389, 2026-08-11) hit the identical 403 and this fallback still lost
      # the build, because the original window was far too small for the fault: attempts fired at
      # 0s/15s/45s and gave up 91 seconds in, while the same call succeeded for the next commit
      # 13 minutes later. Three failures inside 91 seconds says nothing about a fault on that
      # timescale. Hence the wider schedule below.
      #
      # It is not widened to cover the full ~13 minutes, because `concurrency` here is
      # `cancel-in-progress: false`: a run that sits retrying blocks the queued release for a NEWER
      # commit behind it. 7.5 minutes is the compromise — long enough to outlast a fault of the
      # observed shape, short enough that a doomed build does not hold up its own successor for
      # long. When merges land close together the newer build supersedes this one anyway; the case
      # that actually needs the window is a failure on the last merge of the day, where nothing
      # comes along to heal it.
      #
      # If it still gives up, the build is recoverable without a new commit — this workflow takes a
      # `sha` input, so `gh workflow run coil-release.yml -f sha=<sha>` republishes it.
      - name: Retry the release if the action gave up
        if: ${{ steps.create_release.outcome == 'failure' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Pinned. `gh` defaults to the repo it infers from the checkout, and issue #18 in this
          # fork was exactly that inference resolving to the PARENT repo.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_NAME: ${{ needs.resolve.outputs.version }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
          # Same gate as the action above. A release that lands via this fallback must not be a
          # second-class one, and that includes owning the Latest pointer when it has earned it.
          IS_TIP: ${{ needs.resolve.outputs.is_tip }}
        run: |
          set -uo pipefail
          echo "::warning::action-gh-release failed and does not retry; falling back to gh."

          # The fallback publishes the SAME notes the action would have. It used to say "see any
          # earlier release" instead, because the action's inline body was not reachable from
          # here — now that the notes are rendered to a file before either path runs, a release
          # that lands via the fallback is no longer a second-class one.
          if [[ ! -s "${NOTES_FILE:-}" ]]; then
            echo "::warning::No rendered notes at '${NOTES_FILE:-}'; writing a minimal body."
            NOTES_FILE="$RUNNER_TEMP/fallback-release-notes.md"
            printf 'Automated fork build of `%s`.\n\nInstall instructions: https://coil.curlycloud.dev/download\n' \
              "$TARGET_SHA" > "$NOTES_FILE"
          fi

          # Five attempts at 0s, 30s, 90s, 210s and 450s. The empty final element is what makes the
          # last attempt run without a trailing sleep.
          attempt=0
          for backoff in 30 60 120 240 ""; do
            attempt=$((attempt + 1))

            # Idempotent by construction. A retry must never create a second release for a tag, and
            # the previous attempt may have got further than its error suggested — so an existing
            # release is completed with `upload --clobber` rather than recreated.
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG exists; uploading assets."
              if gh release upload "$RELEASE_TAG" staged/T3Coil-* staged/coil-latest.json --clobber; then
                exit 0
              fi
            elif gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "$RELEASE_NAME" \
              --latest="$IS_TIP" \
              --notes-file "$NOTES_FILE" \
              staged/T3Coil-* staged/coil-latest.json; then
              exit 0
            fi

            echo "::warning::Attempt $attempt to publish $RELEASE_TAG failed."
            # An explicit `if` rather than `[ -n "$backoff" ] && sleep ...`: this step runs under
            # the `bash` shell's default `-e`, and a bare test-and-command whose test fails is a
            # trap worth not setting for whoever edits this next.
            if [ -n "$backoff" ]; then
              sleep "$backoff"
            fi
          done

          echo "::error::Could not publish $RELEASE_TAG after $attempt attempts over 7.5 minutes." >&2
          echo "::error::Republish without a new commit: gh workflow run coil-release.yml -f sha=$TARGET_SHA" >&2
          exit 1

      - name: Notify the update relay
        if: ${{ vars.T3X_UPDATE_RELAY_URL != '' }}
        shell: bash
        env:
          RELAY_URL: ${{ vars.T3X_UPDATE_RELAY_URL }}
          HMAC_SECRET: ${{ secrets.T3X_UPDATE_HMAC_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${HMAC_SECRET:-}" ]]; then
            echo "::warning::T3X_UPDATE_HMAC_SECRET is unset; skipping notify. The release is published, clients will find it on their next poll."
            exit 0
          fi

          body="$(cat staged/coil-latest.json)"

          # Build 20 (run 31391175380) died here: the publish had already durably applied — the
          # relay served the new manifest on /latest — but the Durable Object round trip threw a
          # transient runtime exception (Cloudflare's `error code: 1101` after a ~30s stall), the
          # single-shot notify read that as fatal, and one flaky HTTP call reddened a release
          # whose every real effect had succeeded. Retrying is safe by construction: the relay
          # orders on buildNumber, so a retry of an already-accepted publish is not-strictly-newer
          # and comes back 409, which is success below.
          for attempt in 1 2 3; do
            # Re-signed each attempt: the timestamp is bound into the signature and the relay
            # rejects anything older than its skew window, so a reused signature would turn the
            # backoff itself into a 401.
            timestamp="$(date +%s)"
            # Signed material is "<timestamp>.<body>" — the timestamp is bound into the signature so
            # it cannot be rewritten in transit to refresh a captured request. It is a separate value
            # from the manifest's builtAt because uploading ~470 MB routinely takes minutes.
            signature="$(printf '%s.%s' "$timestamp" "$body" \
              | openssl dgst -sha256 -hmac "$HMAC_SECRET" -hex \
              | sed 's/^.*= /sha256=/')"

            # `|| status=000` keeps a connection-level failure (DNS, reset, timeout) inside the
            # retry loop instead of tripping `set -e` before the loop can do its job.
            status="$(curl -sS -m 60 -o /tmp/notify-response.txt -w '%{http_code}' \
              -X POST "${RELAY_URL%/}/notify" \
              -H 'content-type: application/json' \
              -H "x-coil-timestamp: $timestamp" \
              -H "x-coil-signature: $signature" \
              --data-binary "$body")" || status=000

            echo "relay responded $status: $(cat /tmp/notify-response.txt 2>/dev/null)"
            # 409 means the relay already holds this build or a newer one — a retry landing after
            # its first attempt was accepted, or a later run winning the race. Either way the
            # ordering rule is working, not failing.
            if [[ "$status" == "200" || "$status" == "409" ]]; then
              exit 0
            fi

            echo "::warning::Attempt $attempt to notify the relay failed ($status)."
            sleep $((attempt * 15))
          done

          echo "::error::Relay rejected the notification after three attempts." >&2
          exit 1

      - name: Prune old releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One release per merge is unbounded growth at ~470 MB per macOS build.
          #
          # BOTH tag prefixes, permanently — the same reasoning, and the same trap, as the
          # changelog lookup in `resolve`. #71 renamed the release tag from `t3x-build-*` to
          # `coil-build-*` and this filter was missed, so it went on capping the OLD prefix at 10
          # while the new one grew without limit. That failure is invisible by construction:
          # pruning nothing looks exactly like having nothing to prune. Old tags do not expire, so
          # dropping either prefix later would re-break this the same silent way.
          #
          # No longer keyed on isPrerelease. Releases are full releases now (see `make_latest`
          # above), so that predicate would match nothing at all — it would not weaken retention,
          # it would disable it.
          #
          # The isLatest exclusion is a backstop, not a live fix: the cap keeps the newest 10 and
          # the latest release is the newest, so it cannot bite today. It is here so that a future
          # edit to the ordering cannot quietly delete the pointer this workflow just published.
          gh release list --repo "${{ github.repository }}" --limit 200 \
            --json tagName,createdAt,isLatest \
            --jq '[.[] | select((.tagName | startswith("coil-build-")) or (.tagName | startswith("t3x-build-")))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[] | select(.isLatest | not) | .tagName' \
            | while read -r tag; do
                [[ -z "$tag" ]] && continue
                echo "Deleting old release $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes || true
              done
