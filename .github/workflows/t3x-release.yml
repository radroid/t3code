# t3x fork release — build the desktop app on every green merge to main and publish it.
#
# Upstream's release.yml cannot be reused: it runs on blacksmith-12vcpu-macos-26 and
# blacksmith-32vcpu-windows-2025, runners this fork has no access to (the same reason t3x-ci.yml
# exists alongside ci.yml). Every inherited upstream workflow, release.yml included, is
# disabled_manually on this fork.
#
# Standard GitHub-hosted runners — macOS and Windows included — are free with unlimited minutes on
# public repositories, and this fork is public. The build costs nothing.
#
# Design: docs/superpowers/specs/2026-08-03-update-delivery-design.md
name: t3x fork release

# workflow_run, NOT push.
#
# t3x-ci is a separate workflow and `needs:` cannot cross workflows, so this is the only way to
# gate on it. The cost is a footgun that matters enormously here: under workflow_run, github.sha
# is the DEFAULT BRANCH TIP, not the commit that was tested. Every checkout below pins
# workflow_run.head_sha, and the build asserts it got that commit — for a design whose entire
# identity is the commit, building the wrong one is silent and fatal.
on:
  workflow_run:
    workflows: ["t3x fork CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to build (defaults to main's tip)"
        required: false
        type: string

permissions:
  contents: write

# Not cancel-in-progress. A half-cancelled release can leave a tag created and assets missing,
# and two merges landing minutes apart is normal here.
concurrency:
  group: t3x-release
  cancel-in-progress: false

env:
  BUILD_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}

jobs:
  resolve:
    name: Resolve build identity
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      short_sha: ${{ steps.identity.outputs.short_sha }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      changes: ${{ steps.identity.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SHA }}
          # Full history and tags: the changelog is `git log <previous release tag>..<sha>`, and a
          # shallow clone has neither endpoint. Only this job pays for it; build and publish stay
          # shallow.
          fetch-depth: 0
          fetch-tags: true
          # .repos/ is tracked: 12,961 files, 126 MB. Upstream excludes it from every job.
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: identity
        name: Resolve identity
        shell: bash
        # BUILD_SHA is read from the environment rather than interpolated into the script. On the
        # workflow_dispatch path it is user-supplied, and `${{ }}` interpolation splices the raw
        # value into the shell source before bash ever sees it.
        env:
          BUILD_COUNTER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::BUILD_SHA is not a 40-character commit sha." >&2
            exit 1
          fi

          sha="$(git rev-parse HEAD)"
          if [[ "$sha" != "$BUILD_SHA" ]]; then
            echo "::error::Checked out $sha but expected $BUILD_SHA." >&2
            exit 1
          fi

          # 12 characters, matching `git rev-parse --short=12` in build-desktop-artifact.ts and
          # COMMIT_HASH_DISPLAY_LENGTH in DesktopAppIdentity.ts. This is the value the app can
          # actually read about itself, so it is the only honest comparison key.
          short_sha="$(git rev-parse --short=12 HEAD)"

          # The fork's build counter, and the reason the version is orderable at all.
          #
          # The upstream base does not move between syncs (0.0.31 -> 0.0.31, issue #47), so without
          # a fork-owned counter every build here would carry an identical version. An earlier
          # draft used the short sha instead: identifiable, but semver compares prerelease
          # identifiers, and `-t3x.a3f9c21b` vs `-t3x.b0e77c14` sorts alphabetically by hash, which
          # orders nothing. A numeric identifier sorts numerically, so 0.0.31-t3x.43 correctly
          # precedes 0.0.31-t3x.44.
          #
          # This is the SAME number the manifest carries as buildNumber and the relay orders on.
          # One counter, used everywhere, rather than a version scheme that disagrees with the
          # update logic.
          #
          # The sha is not lost: it is in the release tag, both asset filenames, the manifest, and
          # t3codeCommitHash inside the app. Version answers "which is newer"; the hash answers
          # "which commit". Keeping those separate is the whole lesson of #47.
          #
          # --build-version becomes electron-builder's `version` and must be valid semver — a raw
          # sha is not. resolveDesktopUpdateChannel only special-cases -nightly.<d>.<d>, so a -t3x.
          # prerelease stays on the "latest" channel and the product name is unchanged.
          base="$(node -p "require('./apps/desktop/package.json').version")"
          echo "sha=$sha"                          >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha"              >> "$GITHUB_OUTPUT"
          echo "version=${base}-t3x.${BUILD_COUNTER}" >> "$GITHUB_OUTPUT"
          echo "tag=t3x-build-${short_sha}"      >> "$GITHUB_OUTPUT"

          # What changed since the last release we actually published.
          #
          # Anchored on the previous RELEASE TAG, not on main's ancestry. The sync playbook
          # force-pushes main, so "the commits since the last build" cannot be derived from
          # branch history — a released commit may not even be an ancestor of main. Tags survive
          # that rewrite, and `git log A..B` is "reachable from B, not from A", which stays
          # correct when A is not an ancestor of B.
          #
          # Newest first. Merge commits are dropped: on a squash-merge fork their subjects are
          # duplicates of the commit they merged.
          previous="$(git tag --list 't3x-build-*' --sort=-creatordate | head -n 1 || true)"
          if [[ -z "$previous" ]]; then
            # First release ever: there is no range. Emitting the entire history as a "changelog"
            # would render a toast with thousands of entries.
            echo "No previous t3x-build-* tag; emitting an empty changelog."
            changes=""
          else
            echo "Changelog range: ${previous}..${sha}"
            # Capped. An unbounded range after a long CI outage (four straight failures has
            # happened here) would produce a toast nobody can read, and a manifest nobody wants to
            # ship. The count in the title still comes from this list, so the cap is visible as
            # "20 changes" rather than silently truncating a larger number.
            changes="$(git log "${previous}..${sha}" --no-merges --format=%s --max-count=20 || true)"
          fi

          # Commit subjects are attacker-influenced content — anyone whose commit reaches main,
          # including an upstream sync, chooses this text. Two hardening steps, both load-bearing:
          #
          # 1. A random delimiter. With a fixed one, a commit subject equal to that literal would
          #    close the heredoc early and let the rest of the subject write arbitrary job outputs
          #    (`tag=`, `sha=`) — which this workflow then uses to tag and publish a release.
          # 2. Control characters stripped, so nothing can smuggle a newline or an escape sequence
          #    into a value that later lands in an env var and a toast.
          delim="T3X_CHANGES_$(openssl rand -hex 16)"
          changes="$(printf '%s' "$changes" | tr -d '\000-\010\013\014\016-\037')"
          {
            echo "changes<<${delim}"
            echo "$changes"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: [resolve]
    runs-on: ${{ matrix.runner }}
    # Upstream's 30 minutes is calibrated for 12-32 vCPU blacksmith runners. A cold macos-latest
    # (3 vCPU, 7 GB) with no pnpm store, no cargo target dir and an Electron download is
    # realistically 20-40 min; Windows NSIS is 30-60 given issue #47's ~18 min on a warm desktop.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-latest
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            asset_glob: "*.dmg"
            asset_ext: dmg
            manifest_platform: darwin-arm64
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            asset_glob: "*.exe"
            asset_ext: exe
            manifest_platform: win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Free disk space
        if: ${{ matrix.platform == 'mac' }}
        shell: bash
        run: |
          # Standard runners ship ~14 GB free. node_modules alone is ~5.9 GB locally, and the mac
          # build produces an unpacked ~1 GB app plus a 237 MB dmg on top of a second prod install
          # tree. Reclaim what we can before starting.
          sudo rm -rf /Users/runner/Library/Android /Users/runner/hostedtoolcache/CodeQL || true
          df -h /

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # cargo is an UNCONDITIONAL dependency of the desktop build: stageResourceMonitor is called
      # with no platform or flag guard and hard-fails when the binary is missing.
      # native/resource-monitor is edition 2024, so Rust >= 1.85 is required. Do not rely on the
      # runner image having a new enough toolchain.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/resource-monitor

      - name: Ensure Electron runtime is installed
        shell: bash
        # `--filter` is required: ensure:electron is a package task (@t3tools/desktop), not a root
        # one, and `vp run ensure:electron` fails the job outright with "Task not found". Matches
        # ci.yml, release.yml and t3x-weekly-verify.yml, which all scope it the same way.
        run: vp run --filter @t3tools/desktop ensure:electron

      # Installed unconditionally by upstream for Windows, separate from the signing block — the
      # staged `vp install --prod` still runs native lifecycle scripts (node-pty, sharp,
      # msgpackr-extract) and recent MSVC + node-gyp wants the Spectre-mitigated libs.
      - name: Install Spectre-mitigated MSVC libs
        if: ${{ matrix.platform == 'win' }}
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & $installer modify --installPath $vsPath `
            --add "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre" `
            --quiet --norestart | Out-Null

      # Issue #47: the desktop build task intermittently dies with STATUS_DLL_INIT_FAILED
      # (0xC0000142) when three vp tasks spawn concurrently. Running it alone is the mitigation,
      # applied here rather than by editing build-desktop-artifact.ts — `vp run build:desktop` is
      # hardcoded there with no concurrency flag, so changing it would cost a new SEAMS.md row.
      #
      # The flag has to sit BEFORE the task name, and the inner command has to be called
      # directly. `vp run --help` is explicit: "Any arguments after the task name are forwarded
      # to the task process." So a trailing `--concurrency-limit 1` never reached vp at all — it
      # was forwarded down into apps/server's build CLI, which rejected it with "Unrecognized
      # flag" and took the whole bundle build down. Passing it to the root `build:desktop` script
      # would not work either: that script shells out to a second `vp run`, which is a fresh
      # process that resets the limit to its default of 4, so the serialisation would be a no-op.
      - name: Build desktop bundle (serialised)
        shell: bash
        run: |
          set -uo pipefail

          # Inlining build:desktop's body is what lets the flag go in front of the task name, so
          # fail loudly if upstream ever changes that script rather than silently serialising
          # something else — or nothing.
          expected='vp run --filter @t3tools/desktop --filter t3 build'
          actual="$(node -p 'require("./package.json").scripts["build:desktop"] || ""')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::root build:desktop is now '$actual' (expected '$expected'). Re-inline it in t3x-release.yml." >&2
            exit 1
          fi

          log=bundle-attempt.log
          for attempt in 1 2 3; do
            status=0
            # `|| status=$?`, not `if vp …; then exit 0; fi` followed by `status=$?`. After an
            # `if` whose condition failed and whose body never ran, `$?` is the *if statement's*
            # status — zero — so the old form reported every real failure as "exit 0" and the
            # retry classification below could never be reached.
            vp run --concurrency-limit 1 --filter @t3tools/desktop --filter t3 build 2>&1 \
              | tee "$log" || status=$?
            if [[ $status -eq 0 ]]; then
              exit 0
            fi
            # Classified on output, not on the exit code. Bash truncates a child's status to 8
            # bits, so 0xC0000142 can never appear in `$?` to be matched, and vp reports its own
            # status rather than the dead grandchild's anyway.
            #
            # The classifier moved out of an inline grep and into scripts/t3x/windows-exit-codes.mjs
            # because the grep was wrong (#47). It matched `0xC0000142|0xC0000005|
            # STATUS_DLL_INIT_FAILED|Access violation`, and the observed failure contains none of
            # them — vp prints the SIGNED DECIMAL Node reports, `FAILED (exit code: -1073741502)`.
            # The retry could never have fired. Matching every spelling is now covered by tests
            # built on the log from the issue, and the classifier also prints what the status
            # actually means, so a recurrence is diagnosed from this log rather than from a bare
            # negative integer.
            #
            # Exit 0 from it means retry; 1 means this is a real failure and stopping now is right.
            if node scripts/t3x/windows-exit-codes.mjs --classify "$log"; then
              echo "::warning::Attempt $attempt hit a transient Windows process-startup failure (see the classification above). Retrying."
            else
              echo "::error::build:desktop failed with exit $status, and this is not a transient process-startup failure." >&2
              exit "$status"
            fi
          done
          echo "::error::build:desktop failed three times with transient process-startup errors." >&2
          exit 1

      - name: Build desktop artifact
        shell: bash
        env:
          # LOAD-BEARING, NOT HYGIENE.
          #
          # Actions sets GITHUB_REPOSITORY automatically. resolveGitHubPublishConfig reads it,
          # which populates buildConfig.publish, which makes electron-builder write
          # Contents/Resources/app-update.yml into the bundle — and that file is exactly what
          # DesktopUpdates reads to decide hasUpdateFeedConfig. A fork build shipping it would be
          # the FIRST ONE EVER to switch upstream's electron-updater on, version-keyed against a
          # version that never bumps (0.0.31 -> 0.0.31, issue #47).
          #
          # Left empty, resolveGitHubPublishConfig returns undefined, no publish config is written,
          # no app-update.yml is packaged, and the updater disables itself with "no update feed is
          # configured". That is what makes the fork's toast the only update surface, at zero
          # upstream edits. The verify step below asserts it.
          GITHUB_REPOSITORY: ""
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ""
        run: |
          set -euo pipefail
          node scripts/build-desktop-artifact.ts \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.resolve.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Verify no update feed was packaged
        shell: bash
        run: |
          set -euo pipefail
          # The machine-checkable form of "exactly one update surface". This is the claim most
          # likely to regress silently on an upstream sync, so it fails the release rather than
          # shipping an app with two updaters that disagree.
          if find release -name "app-update.yml" -print -quit | grep -q .; then
            echo "::error::app-update.yml was packaged. Upstream's updater would be live in this build." >&2
            find release -name "app-update.yml" >&2
            exit 1
          fi
          echo "No app-update.yml packaged."

      - name: Collect and rename
        id: collect
        shell: bash
        env:
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          ARCH: ${{ matrix.arch }}
          ASSET_EXT: ${{ matrix.asset_ext }}
          ASSET_GLOB: ${{ matrix.asset_glob }}
          MANIFEST_PLATFORM: ${{ matrix.manifest_platform }}
        run: |
          set -euo pipefail
          mkdir -p staged

          # artifactName is "T3-Code-${version}-${arch}.${ext}", and this fork's version never
          # bumps — so without renaming, every release's asset is literally the same filename.
          # That is issue #47's stale-artifact hazard wearing a different hat.
          src="$(find release -maxdepth 1 -name "$ASSET_GLOB" -print -quit)"
          if [[ -z "$src" ]]; then
            echo "::error::No $ASSET_GLOB produced in release/." >&2
            exit 1
          fi

          dest="staged/T3Code-${SHORT_SHA}-${ARCH}.${ASSET_EXT}"
          mv "$src" "$dest"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sha256="$(certutil -hashfile "$dest" SHA256 | sed -n '2p' | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
            bytes="$(stat -c %s "$dest")"
          else
            sha256="$(shasum -a 256 "$dest" | cut -d' ' -f1)"
            bytes="$(stat -f %z "$dest")"
          fi

          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              platform: process.argv[2],
              file: path.basename(process.argv[3]),
              sha256: process.argv[4],
              bytes: Number(process.argv[5]),
            }));
          ' "staged/asset-${MANIFEST_PLATFORM}.json" \
            "$MANIFEST_PLATFORM" "$dest" "$sha256" "$bytes"

          ls -la staged

      - name: Upload staged artifact
        uses: actions/upload-artifact@v4
        with:
          name: t3x-release-${{ matrix.manifest_platform }}
          path: staged/*
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish and notify
    needs: [resolve, build]
    runs-on: ubuntu-latest
    # 25, not 15: the release fallback below can now spend 7.5 minutes retrying a transient 403,
    # and that has to fit alongside the artifact download with headroom to spare.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: |
            /scripts
            /package.json
          sparse-checkout-cone-mode: false

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: t3x-release-*
          merge-multiple: true
          path: staged

      - name: Assemble manifest
        id: manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          FULL_SHA: ${{ needs.resolve.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          # run_id addresses the run URL; run_number is the build counter. Different numbers —
          # passing run_number here yields a link to whichever run happens to own that id.
          RUN_ID: ${{ github.run_id }}
          # Read as an env var, never interpolated into shell source: these are commit subjects,
          # so the content is chosen by whoever wrote the commit.
          CHANGES: ${{ needs.resolve.outputs.changes }}
        run: node scripts/t3x/build-update-manifest.mjs staged staged/t3x-latest.json

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        # The retry below is the error handling for this step, so a failure here must not end the
        # job before it runs.
        continue-on-error: true
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          name: ${{ needs.resolve.outputs.version }}
          prerelease: true
          files: |
            staged/T3Code-*
            staged/t3x-latest.json
          fail_on_unmatched_files: true
          # The manual-install commands are here rather than in a doc because this page is where
          # someone stands when they need them. Both platforms' in-app updaters already handle
          # this — macAttachCommands/macCopyCommands strip quarantine from the dmg and the staged
          # bundle — so ONLY a hand-downloaded copy hits it, which is exactly the bootstrap case:
          # the first install on a machine, and any install after the updater itself breaks.
          body: |
            Automated fork build of `${{ needs.resolve.outputs.sha }}`.

            Unsigned. In-app updates strip quarantine themselves; a **manually downloaded** copy
            does not go through that path and needs one command by hand.

            **macOS** — drag the app to `/Applications` FIRST. Launching from the mounted dmg
            triggers App Translocation, and the updater refuses to replace a translocated app.
            Then:

            ```
            xattr -dr com.apple.quarantine "/Applications/T3 Code (Alpha).app"
            ```

            Without this, Gatekeeper calls the app *damaged* rather than merely unsigned — the
            bundle carries Electron's inherited ad-hoc linker signature with no sealed resources —
            and right-click → Open does NOT bypass that.

            **Windows** — clear Mark-of-the-Web, then choose *More info → Run anyway* at the
            SmartScreen prompt:

            ```
            Unblock-File -Path .\T3Code-${{ needs.resolve.outputs.short_sha }}-x64.exe
            ```

            Windows x64 only; there is no arm64 asset. SHA-256 for every asset is in
            `t3x-latest.json` above.

            Design: `docs/superpowers/specs/2026-08-03-update-delivery-design.md`.

      # Build 9 (run 31244161522) died here: both matrix legs green, both artifacts uploaded, and
      # then ~22 minutes of macOS and Windows compute discarded by one 14-second API call that
      # returned 403 "Resource not accessible by integration".
      #
      # Nothing in the repository explains that 403, and it was checked rather than assumed: the
      # failing job and the job that succeeded 15 minutes later logged IDENTICAL token permissions
      # (`Contents: write`, `Metadata: read`), the workflow has carried `permissions: contents:
      # write` in every revision, the repo default is `write`, and there are no rulesets and no tag
      # protection. So it was transient.
      #
      # The action turns a transient fault into a permanent one on purpose — it logs "Skip retry —
      # your GitHub token/PAT does not have the required permission to create a release" and gives
      # up, because it reads every 403 as a misconfiguration. That is a reasonable default and the
      # wrong one here, where the cost of being wrong is a whole build.
      #
      # Build 24 (run 31453501389, 2026-08-11) hit the identical 403 and this fallback still lost
      # the build, because the original window was far too small for the fault: attempts fired at
      # 0s/15s/45s and gave up 91 seconds in, while the same call succeeded for the next commit
      # 13 minutes later. Three failures inside 91 seconds says nothing about a fault on that
      # timescale. Hence the wider schedule below.
      #
      # It is not widened to cover the full ~13 minutes, because `concurrency` here is
      # `cancel-in-progress: false`: a run that sits retrying blocks the queued release for a NEWER
      # commit behind it. 7.5 minutes is the compromise — long enough to outlast a fault of the
      # observed shape, short enough that a doomed build does not hold up its own successor for
      # long. When merges land close together the newer build supersedes this one anyway; the case
      # that actually needs the window is a failure on the last merge of the day, where nothing
      # comes along to heal it.
      #
      # If it still gives up, the build is recoverable without a new commit — this workflow takes a
      # `sha` input, so `gh workflow run t3x-release.yml -f sha=<sha>` republishes it.
      - name: Retry the release if the action gave up
        if: ${{ steps.create_release.outcome == 'failure' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Pinned. `gh` defaults to the repo it infers from the checkout, and issue #18 in this
          # fork was exactly that inference resolving to the PARENT repo.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_NAME: ${{ needs.resolve.outputs.version }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -uo pipefail
          echo "::warning::action-gh-release failed and does not retry; falling back to gh."

          # The notes the action would have published are not reachable from here, so the fallback
          # release points at the one place that always carries them rather than duplicating the
          # text and letting the two copies drift.
          notes="Automated fork build of \`${TARGET_SHA}\`.

          Published by the fallback path after \`action-gh-release\` returned a transient error.
          Install notes: see any earlier release on this repo, or the design doc at
          \`docs/superpowers/specs/2026-08-03-update-delivery-design.md\`."

          # Five attempts at 0s, 30s, 90s, 210s and 450s. The empty final element is what makes the
          # last attempt run without a trailing sleep.
          attempt=0
          for backoff in 30 60 120 240 ""; do
            attempt=$((attempt + 1))

            # Idempotent by construction. A retry must never create a second release for a tag, and
            # the previous attempt may have got further than its error suggested — so an existing
            # release is completed with `upload --clobber` rather than recreated.
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG exists; uploading assets."
              if gh release upload "$RELEASE_TAG" staged/T3Code-* staged/t3x-latest.json --clobber; then
                exit 0
              fi
            elif gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "$RELEASE_NAME" \
              --prerelease \
              --notes "$notes" \
              staged/T3Code-* staged/t3x-latest.json; then
              exit 0
            fi

            echo "::warning::Attempt $attempt to publish $RELEASE_TAG failed."
            # An explicit `if` rather than `[ -n "$backoff" ] && sleep ...`: this step runs under
            # the `bash` shell's default `-e`, and a bare test-and-command whose test fails is a
            # trap worth not setting for whoever edits this next.
            if [ -n "$backoff" ]; then
              sleep "$backoff"
            fi
          done

          echo "::error::Could not publish $RELEASE_TAG after $attempt attempts over 7.5 minutes." >&2
          echo "::error::Republish without a new commit: gh workflow run t3x-release.yml -f sha=$TARGET_SHA" >&2
          exit 1

      - name: Notify the update relay
        if: ${{ vars.T3X_UPDATE_RELAY_URL != '' }}
        shell: bash
        env:
          RELAY_URL: ${{ vars.T3X_UPDATE_RELAY_URL }}
          HMAC_SECRET: ${{ secrets.T3X_UPDATE_HMAC_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${HMAC_SECRET:-}" ]]; then
            echo "::warning::T3X_UPDATE_HMAC_SECRET is unset; skipping notify. The release is published, clients will find it on their next poll."
            exit 0
          fi

          body="$(cat staged/t3x-latest.json)"

          # Build 20 (run 31391175380) died here: the publish had already durably applied — the
          # relay served the new manifest on /latest — but the Durable Object round trip threw a
          # transient runtime exception (Cloudflare's `error code: 1101` after a ~30s stall), the
          # single-shot notify read that as fatal, and one flaky HTTP call reddened a release
          # whose every real effect had succeeded. Retrying is safe by construction: the relay
          # orders on buildNumber, so a retry of an already-accepted publish is not-strictly-newer
          # and comes back 409, which is success below.
          for attempt in 1 2 3; do
            # Re-signed each attempt: the timestamp is bound into the signature and the relay
            # rejects anything older than its skew window, so a reused signature would turn the
            # backoff itself into a 401.
            timestamp="$(date +%s)"
            # Signed material is "<timestamp>.<body>" — the timestamp is bound into the signature so
            # it cannot be rewritten in transit to refresh a captured request. It is a separate value
            # from the manifest's builtAt because uploading ~470 MB routinely takes minutes.
            signature="$(printf '%s.%s' "$timestamp" "$body" \
              | openssl dgst -sha256 -hmac "$HMAC_SECRET" -hex \
              | sed 's/^.*= /sha256=/')"

            # `|| status=000` keeps a connection-level failure (DNS, reset, timeout) inside the
            # retry loop instead of tripping `set -e` before the loop can do its job.
            status="$(curl -sS -m 60 -o /tmp/notify-response.txt -w '%{http_code}' \
              -X POST "${RELAY_URL%/}/notify" \
              -H 'content-type: application/json' \
              -H "x-t3x-timestamp: $timestamp" \
              -H "x-t3x-signature: $signature" \
              --data-binary "$body")" || status=000

            echo "relay responded $status: $(cat /tmp/notify-response.txt 2>/dev/null)"
            # 409 means the relay already holds this build or a newer one — a retry landing after
            # its first attempt was accepted, or a later run winning the race. Either way the
            # ordering rule is working, not failing.
            if [[ "$status" == "200" || "$status" == "409" ]]; then
              exit 0
            fi

            echo "::warning::Attempt $attempt to notify the relay failed ($status)."
            sleep $((attempt * 15))
          done

          echo "::error::Relay rejected the notification after three attempts." >&2
          exit 1

      - name: Prune old prereleases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One prerelease per merge is unbounded growth at ~470 MB per macOS build.
          gh release list --repo "${{ github.repository }}" --limit 200 \
            --json tagName,createdAt,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("t3x-build-")))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                [[ -z "$tag" ]] && continue
                echo "Deleting old prerelease $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes || true
              done
