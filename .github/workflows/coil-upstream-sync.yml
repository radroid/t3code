# coil daily upstream sync — see docs/superpowers/specs/2026-07-23-fork-upstream-sync-design.md
# (A4, and its 2026-09-02 amendment). Merges pingdotgg/t3code into the fork's `main`, verifies,
# and fast-forwards `main` when green. On conflict or red verification it pushes nothing and
# escalates via a `coil-sync` issue.
#
# The sync MERGES; it does not rebase. `main` only ever moves forward, so nothing here
# force-pushes and no worktree, tag, open PR or in-flight branch is invalidated by a sync.
#
# NOTE: runs on ubuntu-latest — the fork has no access to upstream's blacksmith-* runners.
name: coil upstream sync (daily)

on:
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Merge + verify but do not push"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: coil-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/pingdotgg/t3code.git
  SYNC_LABEL: coil-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork main (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # persist-credentials (default) makes the final push reuse THIS token.
          #
          # It must not be GITHUB_TOKEN: GitHub refuses any push from GITHUB_TOKEN that creates
          # or updates a file under `.github/workflows/**`, and that is not grantable from the
          # `permissions:` block (there is no `workflows` key there). The moment an absorbed
          # upstream commit touches a workflow file — first seen 2026-08-11 with upstream
          # 1b120f352 — the whole sync verifies clean and then dies at the push. So push as
          # T3X_SYNC_TOKEN: a classic PAT with `repo` + `workflow`, or an app installation
          # token with Workflows: write.
          #
          # The fallback keeps the job working (for ranges that touch no workflow file) when the
          # secret is absent; the push step below escalates with the exact remedy if it bites.
          token: ${{ secrets.T3X_SYNC_TOKEN || github.token }}

      # NOTE: no rerere cache here on purpose. The CI job only aborts on conflict (it
      # never resolves), so it neither produces nor consumes shared resolutions. rerere
      # lives locally, where the sync agent actually resolves conflicts.

      - name: Configure git
        run: |
          git config user.name "coil-sync-bot"
          git config user.email "coil-sync-bot@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git remote set-url --push upstream DISABLE_PUSH_TO_UPSTREAM

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Tag pre-merge last-good state
        # A rollback point, not a landing mechanism. The sync only fast-forwards `main`, so the
        # normal way to undo a bad sync is `git revert -m 1 <merge sha>` — an ordinary commit that
        # keeps history intact. Know what that means before reaching for it: the merge stays in
        # `main`'s ancestry, so tomorrow's sync sees the range as already absorbed (exit 10) and
        # never re-offers it, and later syncs land on the reverted tree. Re-absorbing means
        # reverting the revert on a branch. This tag is the second option: it names the exact
        # pre-sync tip, so a human can diff against it, or reset to it if a revert is not enough.
        run: |
          TAG="coil/last-good-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$TAG"
          # Only advertise the recovery tag if it actually reached origin. A local-only tag
          # on this ephemeral runner is unrecoverable, so it must not appear in the issue.
          if git push origin "refs/tags/$TAG"; then
            echo "RECOVERY_TAG=$TAG" >> "$GITHUB_ENV"
          else
            echo "::warning::could not push recovery tag $TAG; it will not be advertised"
          fi

      - name: Merge + verify
        id: sync
        run: |
          set +e
          RUN="vp run" VERIFY="typecheck lint test" \
            scripts/coil/sync-upstream.sh
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Push (clean + not dry-run)
        id: push
        if: steps.sync.outputs.code == '0' && github.event.inputs.dry_run != 'true'
        run: |
          # A plain push. The merge commit sits on top of the `main` this job checked out, so this
          # is a fast-forward; there is no lease to take and nothing to overwrite. If someone else
          # advanced `main` mid-run the push is simply rejected and the next run merges again.
          #
          # Deliberately does NOT die here. A push that fails after a clean, verified merge used
          # to end the job red with no `coil-sync` issue and no sync branch — indistinguishable
          # from a sync that never ran. Record the failure and let the escalation step below
          # open the issue.
          set +e
          OUT="$(git push origin main 2>&1)"
          CODE=$?
          set -e
          printf '%s\n' "$OUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [[ "$CODE" -eq 0 ]]; then
            echo "::notice::fast-forwarded origin/main onto the merged upstream range"
          else
            {
              echo 'error<<T3X_PUSH_EOF'
              printf '%s\n' "$OUT" | tail -n 30
              echo 'T3X_PUSH_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::push to origin main failed (exit $CODE); escalating"
          fi

      - name: Report clean no-op
        if: steps.sync.outputs.code == '10'
        run: echo "::notice::upstream unchanged; nothing to sync"

      - name: Escalate on conflict / failure / failed push
        # The push clause covers the case the sync script itself calls success: merge clean,
        # verify green, and then the push to `main` is rejected. `steps.push.outputs.code` is
        # empty when that step was skipped (dry run, no-op, earlier escalation).
        if: >
          steps.sync.outputs.code == '20' || steps.sync.outputs.code == '30' ||
          steps.sync.outputs.code == '1' ||
          (steps.push.outputs.code != '' && steps.push.outputs.code != '0')
        env:
          GH_TOKEN: ${{ github.token }}
          # Pin every gh call below to THIS fork. The "Configure git" step adds a remote named
          # `upstream` (the parent repo); gh's base-repo resolution ranks `upstream` above
          # `origin`, so un-pinned gh commands silently target the PARENT — where GITHUB_TOKEN
          # has no write access — and `gh issue create` fails, leaving escalations red with no
          # coil-sync issue ever opened. GH_REPO forces the fork for label/list/create/edit alike.
          GH_REPO: ${{ github.repository }}
          PUSH_CODE: ${{ steps.push.outputs.code }}
          PUSH_ERROR: ${{ steps.push.outputs.error }}
          # The boolean only — never the secret itself — so the issue can name which of the two
          # push-failure stories this is instead of guessing from stderr.
          SYNC_TOKEN_SET: ${{ secrets.T3X_SYNC_TOKEN != '' }}
        run: |
          # Best-effort, idempotent label create (tolerates "already exists"). The label is
          # also provisioned out-of-band, so issue creation below never depends on this line.
          gh label create "$SYNC_LABEL" --color B60205 --description "Upstream sync needs a human/agent" 2>/dev/null || true

          STATUS="$(cat coil-sync-status.json 2>/dev/null || echo '{"result":"unknown"}')"
          RESULT="$(echo "$STATUS" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("result","unknown"))' 2>/dev/null || echo unknown)"
          EXTRA=""
          FIX='▶ **To fix:** comment `@claude resolve` on this issue (or run the *coil sync resolve (agent)* workflow). An agent replays the merge, resolves the conflicts, runs typecheck/lint/test, and opens an ordinary PR for review — nothing is pushed to `main`. Runbook: `docs/coil/sync-agent-runbook.md`.'

          if [[ -n "$PUSH_CODE" && "$PUSH_CODE" != "0" ]]; then
            # Merge and verify were GREEN — the status JSON says so, which is exactly why both
            # the result line and the fix line have to be replaced. Sending the resolver at this
            # is a wasted agent budget on a merge that already worked.
            RESULT="push-failed"
            if [[ "$SYNC_TOKEN_SET" == "true" ]]; then
              HINT='`T3X_SYNC_TOKEN` **is** configured, so this is not the `.github/workflows/**` scope wall — read the push output below. A non-fast-forward rejection (`fetch first`) means `main` moved during the run; just re-run. Anything else is a credential or branch-protection problem.'
            else
              HINT='`T3X_SYNC_TOKEN` is **not configured**, so this job pushed as `GITHUB_TOKEN` — which GitHub forbids from creating or updating any file under `.github/workflows/**`. If the absorbed upstream range touched a workflow file, that is this failure, and no `permissions:` setting can grant it. Add a repo secret `T3X_SYNC_TOKEN` (classic PAT with `repo` + `workflow` scope, or an app installation token with **Workflows: write**) and re-run this workflow.'
            fi
            EXTRA="$(printf '\n\n**The merge verified clean — only the push failed.** `origin/main` is unchanged and open PRs are untouched. Re-running this workflow replays the whole sync safely.\n\n%s\n\n<details><summary>git push output</summary>\n\n```\n%s\n```\n\n</details>' \
              "$HINT" "$PUSH_ERROR")"
            FIX='▶ **To fix:** read the push output. If it says `fetch first` / non-fast-forward, `main` simply moved while the job ran — re-running *coil upstream sync (daily)* is the whole fix. Otherwise it is a credential or branch-protection problem: fix that, then re-run. Either way this is not a conflict — do **not** run the resolver agent. Runbook: `docs/coil/sync-agent-runbook.md`.'
          fi

          TITLE="[coil-sync] daily sync needs attention ($RESULT)"

          BODY="$(printf 'Automated daily upstream sync could not complete.\n\n**Result:** `%s`\n**Recovery tag:** `%s`\n**Run:** %s%s\n\n<details><summary>status JSON</summary>\n\n```json\n%s\n```\n\n</details>\n\n---\n\n%s' \
            "$RESULT" "${RECOVERY_TAG:-none}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "$EXTRA" "$STATUS" "$FIX")"

          # Find an existing open sync thread. Try the label first, then fall back to the title
          # marker so a not-yet-attached label can't hide it and spawn a duplicate.
          # `.[0].number` on an empty list prints literal "null"; `// empty` yields "".
          EXISTING="$(gh issue list --label "$SYNC_LABEL" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [[ -z "$EXISTING" ]]; then
            EXISTING="$(gh issue list --search 'coil-sync in:title' --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          fi

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body "$BODY"
            gh issue edit "$EXISTING" --add-label "$SYNC_LABEL" 2>/dev/null || true
            echo "::notice::updated existing coil-sync issue #$EXISTING"
          else
            # Create WITHOUT --label, then attach the label. `gh issue create --label` aborts the
            # whole creation when the label lookup lags behind `gh label create` (GitHub API
            # replication) — that race is why prior runs went red with NO issue ever opened.
            # Decoupling guarantees the escalation issue always lands.
            # Do NOT swallow stderr here: if the create fails, its error must reach the run log
            # so the cause is diagnosable (`|| true` keeps set -e happy on failure).
            URL="$(gh issue create --title "$TITLE" --body "$BODY" || true)"
            NUM="${URL##*/}"
            if [[ -n "$NUM" ]]; then
              gh issue edit "$NUM" --add-label "$SYNC_LABEL" 2>/dev/null || true
              echo "::notice::opened new coil-sync issue #$NUM"
            else
              echo "::error::failed to open coil-sync issue"
            fi
          fi
          # Surface as a red run so it's visible in the Actions tab too.
          exit 1
