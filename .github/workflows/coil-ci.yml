# coil fork CI — the fork's real PR/main gate.
#
# Upstream's ci.yml runs on blacksmith-* runners the fork has no access to, so it never runs
# here and PRs show "no checks". This runs the same fast checks on ubuntu-latest so every fork
# PR (and every push to main / a sync branch) gets an independent typecheck/lint/test gate.
#
# NOTE: a sync PR is an ordinary PR now that the fork merges upstream instead of rebasing onto it
# — `main` is an ancestor of the branch, GitHub can build the merge ref, and `pull_request` fires
# like it does anywhere else. The `coil/sync-**` push trigger is kept as an EARLY signal: it runs
# the moment the resolver pushes the branch, before a human opens or reopens the PR, and it is an
# independent check alongside the resolve job's own verify.
name: coil fork CI

on:
  pull_request:
  push:
    branches:
      - main
      - "coil/sync-**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: coil-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # Run both even if typecheck fails, so a single run reports every failure.
      - name: Typecheck
        run: vp run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: vp run lint

  # The test jobs mirror upstream's ci.yml split: web and server each get their own runners, and
  # everything else shares one. In a single job (before 2026-10-08) the web suite ran alongside
  # mobile and desktop, and on these runners `MessagesTimeline.test.tsx` blew the 30s budget its
  # own `beforeAll` pins for a heavy import (3 of 3 runs). An in-file literal beats
  # `--hookTimeout`, so the only fork-side fix is to stop starving the web suite of CPU.
  #
  # `--testTimeout` is raised because `apps/web/vite.config.ts` pins testTimeout to 15s, which is
  # tuned for upstream's blacksmith runners. On ubuntu-latest, upstream's `stashImageCompression`
  # worst-case test (~3s on an M-series Mac; 6x the next slowest in its file) reliably exceeds 15s.
  # Proven upstream-inherited, not a fork regression: branch `t3x/ci-control-upstream` — pristine
  # upstream/main plus this workflow file and nothing else — fails identically (run 30386125253).
  #
  # 120000 is deliberate: it is the HIGHEST value any package configures
  # (apps/server/vite.config.ts pins 120s for sqlite+git+orchestration integration tests). The
  # flag applies to every package, so a lower value would silently CUT apps/server's budget. At
  # 120s no package is lowered: web 15s -> 120s, root 60s -> 120s, server 120s -> 120s. Each job's
  # `timeout-minutes` remains the backstop against a genuinely hung test.
  #
  # `--hookTimeout` is raised for the same reason and is NOT covered by `--testTimeout`: a
  # `beforeAll`/`beforeEach` gets its own budget, unless the file passes one itself.
  # Keep in sync with the `test` case in `scripts/coil/sync-upstream.sh`.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # Upstream #10021 (498ab9c399) builds a native browser-secret helper against libsecret; its
      # test (`apps/desktop/scripts/browser-secret-native.test.mjs`) and the desktop artifact build
      # both hard-fail on Linux without the headers. Upstream installs them in ci.yml (plus a
      # Blacksmith mirror rewrite this runner does not have).
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      # `@t3tools/monorepo` is the root package; its `test` script is `vp run -r test`.
      - name: Test
        run: vp run --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test --testTimeout=120000 --hookTimeout=120000

  test_web:
    name: Test Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        run: vp run --filter @t3tools/web test --testTimeout=120000 --hookTimeout=120000

  # apps/server sets `fileParallelism: false`, so its 524 test files run one at a time. Upstream
  # shards them six ways by recorded duration (apps/server/src/testUtils/weightedShardSequencer.ts).
  test_server:
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # Upstream's ServerBrowserPage.test.ts drives a real headless Chromium; upstream's ci.yml
      # installs it the same way before its server tests.
      - name: Install Chromium for server browser integration tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }} --testTimeout=120000 --hookTimeout=120000
