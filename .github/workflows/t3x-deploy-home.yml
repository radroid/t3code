# Deploys the fork's homepage (apps/t3x-home) to the `t3x-home` Cloudflare Worker.
#
# Requires the repo secret CLOUDFLARE_API_TOKEN (Account → Workers Scripts → Edit) and the repo
# variable CLOUDFLARE_ACCOUNT_ID. Until the secret exists this job fails at the deploy step;
# `pnpm run deploy` from apps/t3x-home keeps working in the meantime.
#
# The daily sync force-pushes `main`, and on an undiffable force push GitHub runs `paths`-filtered
# workflows anyway. That is harmless: `wrangler deploy` is idempotent.
name: "t3x: deploy homepage"

on:
  push:
    branches:
      - main
    paths:
      - "apps/t3x-home/**"
      - ".github/workflows/t3x-deploy-home.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t3x-home-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy t3x-home
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/t3x-home...

      - name: Build
        run: vp run --filter @t3tools/t3x-home build

      # wrangler is fetched on demand rather than depended on — it drags ~500 lines into
      # pnpm-lock.yaml, which SEAMS.md records as the fork's second-worst rebase-conflict surface.
      - name: Deploy to Cloudflare
        working-directory: apps/t3x-home
        run: pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live site
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://t3x-home.businesses.workers.dev/)
          test "$code" = "200" || { echo "site returned $code"; exit 1; }
